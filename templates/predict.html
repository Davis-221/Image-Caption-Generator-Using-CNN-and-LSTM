{% extends "base2.html" %}
{% block title %}Predicted Caption{% endblock %}
{% block content %}
<html>
<head>
    <style>
        *{
            padding:0;
            margin:0;
            box-sizing:border-box;
        }
        body
        {
            font-family: verdana;
            background-repeat:no-repeat;
            background-attached:fixed;
            background-size:cover;
            background-image:url({{url_for('static', filename='images/background_image2.jpeg')}});
        }
        .banner-area{
            width:100%;
            height:3vh;
            background:linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5))
            background-size:cover;

        }
        .content-area{
            height:100%;
            display:flex;
            justify-content:center;
        }
        .content{
            text-align:center;
        }
        .content h1{
            font-size:80px;
            color:#fff;
        }
    </style>
</head>
<body>
    <div class="banner-area">
        <div class="content-area">
            <div class="content">

                <h1>Predicted Caption</h1>
            </div>
        </div>
    </div>
</body>
</html>
{% endblock %}
